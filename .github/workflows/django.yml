name: Django checks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      DJANGO_SETTINGS_MODULE: mi_proyecto.settings_test

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: mi_proyecto/requirements.txt
      - name: Instalar dependencias del sistema
        run: sudo apt-get update && sudo apt-get install --yes default-libmysqlclient-dev build-essential pkg-config
      - name: Instalar dependencias de Python
        run: python -m pip install --upgrade pip && pip install -r mi_proyecto/requirements.txt
      - name: Comprobar migraciones pendientes
        working-directory: mi_proyecto
        run: python manage.py makemigrations --check --dry-run
      - name: Ejecutar comprobaciones y pruebas
        working-directory: mi_proyecto
        run: python manage.py check && python manage.py test

